      PPLR: { code:'PPLR', name:'精衛 (The Persistent Bird)', creature:'精衛', description:'生理功能 × 加工食品 × 輕盈 × 規律', insight:'銜石之鳥。為了達成生存目標，規律攝取極低負擔的煉化補給，堅毅且枯燥。', emoji:'🐦' },
      PPLV: { code:'PPLV', name:'影 (The Shadow Runner)', creature:'影', description:'生理功能 × 加工食品 × 輕盈 × 飄忽', insight:'隨風之魅。隨性攝取加工輕食，生存優先，沒有定性，存在感薄弱。', emoji:'👤' },
    };

    const CREATURE_IMG = {
      MNHR:'openspec/asset/png/7.png',  MNHV:'openspec/asset/png/8.png',

      PNHR:'openspec/asset/png/11.png', PNHV:'openspec/asset/png/13.png',

      PPHR:'openspec/asset/png/16.png', PPHV:'openspec/asset/png/10.png',
      PPLR:'openspec/asset/png/14.png', PPLV:'openspec/asset/png/9.png',
    };

    const BODY_FEELING_OPTIONS = [
      { label:'清爽', emoji:'🍃' }, { label:'飽足', emoji:'🥣' }, { label:'胃脹', emoji:'🎈' },
      { label:'心悸', emoji:'💓' }, { label:'想睡', emoji:'🛌' }, { label:'口渴', emoji:'🥤' },
    ];

    const FORTUNES = [
      { id:'f1', title:'業障初現，警示之兆', verse:['精製加工堆積體脂','動物油脂纏繞血管','纖維雖在難以抵擋','轉運需從明日做起'], advice:['宜 飯後步行20分鐘','晚餐選清蒸食物','補充膳食纖維'], fortuneType:'warning' },
      { id:'f2', title:'法脈圓通，修行之時', verse:['清淡蔬食滋養神魂','五穀雜糧穩固根基','不假外求身心自如','福報已在腸胃之間'], advice:['宜 持續今日餐單','多飲溫潤山泉','靜坐片刻安神'], fortuneType:'blessing' },
      { id:'f3', title:'情執深重，心緒之結', verse:['以食止痛愁上加愁','甜膩入口百苦不解','胃納雖滿心神仍缺','暫歇外物尋回本心'], advice:['宜 遠離電子訊號','忌 深夜情緒進食','補充優質蛋白'], fortuneType:'warning' },
      { id:'f4', title:'天時有序，節律之美', verse:['準時進食陰陽平衡','不躁不急脾胃悠歸','日常點滴皆是修行','長此以往百病不侵'], advice:['宜 睡覺前四小時禁食','忌 暴飲暴食','早起飲一杯暖水'], fortuneType:'blessing' },
      { id:'f5', title:'燥火上升，急功近利', verse:['重口油膩灼燒內府','雖得瞬息感官之愉','難換久長生理之安','此乃透支身體之兆'], advice:['宜 搭配涼性蔬果','忌 辛辣刺激','飲用微溫淡茶'], fortuneType:'warning' },
      { id:'f6', title:'氣形合一，神清氣爽', verse:['輕盈入口通達經絡','不偏不倚適可而止','今日所食皆為良藥','行住坐臥自在無礙'], advice:['宜 維持目前頻率','宜 分享快樂食緒','深呼吸納入真氣'], fortuneType:'blessing' },
      { id:'f7', title:'陰霾未散，空洞之困', verse:['求不得中執著外象','味同嚼蠟神魂缺位','此餐非食乃是抗爭','接受脆弱方得圓滿'], advice:['宜 尋找摯友傾訴','忌 獨自進食宵夜','聽清香古琴之音'], fortuneType:'warning' },
      { id:'f8', title:'繁瑣過境，簡約之道', verse:['雜亂無度損耗元神','速成之物缺法自然','向內觀照簡化日常','自有一番天地氣量'], advice:['宜 簡化料理流程','宜 慢速細嚼三十下','忌 狼吞虎嚥'], fortuneType:'normal' },
    ];

    const LEADERBOARD_DATA = [
      { rank:1, name:'玄武大師', points:4520, code:'MNHR' },
      { rank:2, name:'九尾仙人', points:3880, code:'MNLV' },

    // ── Utils ──
    const cn = (...classes) => classes.filter(Boolean).join(' ');
    const ACTIVE_USER_KEY = 'foodmood_active_user';
    const PROFILES_KEY = 'foodmood_profiles';
    const normalizeEmail = (email) => email.trim().toLowerCase();
    const loadProfiles = () => { try { const r = localStorage.getItem(PROFILES_KEY); return r ? JSON.parse(r) : {}; } catch { return {}; } };
    const saveProfiles = (p) => localStorage.setItem(PROFILES_KEY, JSON.stringify(p));

    // ── Gemini Service ──
    const getMockFortune = (recordData) => {
      const mood = recordData?.mood || '平靜';
      const food = recordData?.foodEmoji || '這一餐';
      const context = recordData?.context || '日常';
      const bodyFeeling = recordData?.bodyFeeling || '尚可';
      const isHeavy = ['焦慮','煩躁','空虛','後悔'].includes(mood);
      const isRepair = ['被安撫','滿足','平靜','有精神'].includes(mood);
      return {
        id: `mock-${Date.now()}`,
        title: isHeavy ? `夜火未熄，${food}暫鎮心潮` : isRepair ? `${food}入腹，微光歸位` : '肉香鎮魂，麵線續命',
        verse: [`${food}為舟，載你過潮`, `${context}之下，胃先應劫`, `${mood}未必是錯，只是太晚`, `${bodyFeeling}有聲，明日宜和`],
        advice: [
          isHeavy ? '宜：先補溫水，再慢慢吃完' : '宜：維持節奏，七分飽即可',
          isHeavy ? '忌：邊焦慮邊續杯咖啡' : '忌：吃完立刻久坐不動',
          `解讀：你吃的不是單一食物，而是當下想被接住的感受。關鍵詞：${food}・${mood}・${context}`
        ],
        fortuneType: isHeavy ? 'warning' : isRepair ? 'blessing' : 'normal'
      };
    };

    const generateAIFortune = async (recordData) => {
      if (!GEMINI_API_KEY) return getMockFortune(recordData);
      const { mealType, foodType, mood, bodyFeeling, context, foodEmoji } = recordData;
      const prompt = `你是「食緒解籤」AI。請根據使用者輸入的食物與情境做動態分析。輸入：食物/情境=${foodEmoji}，餐別=${mealType}，餐後心情=${mood}，身體感受=${bodyFeeling}，當下情境=${context}。請輸出 JSON，包含：title(string), verse(4個string的array), advice(3個string的array), fortuneType("warning"|"normal"|"blessing")。國風但現代風格，溫柔且有一點黑色幽默。只輸出JSON。`;
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }], generationConfig:{ responseMimeType:'application/json' } })
        });
        const data = await res.json();
        const parsed = JSON.parse(data.candidates[0].content.parts[0].text);
        return { id:`ai-${Date.now()}`, ...parsed };
      } catch (e) {
        console.error('Gemini error:', e);
        return getMockFortune(recordData);
      }
    };

    const PlusIcon = ({ size=20 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>;
    const BarChartIcon = ({ size=20 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>;

    const InfoIcon = ({ size=20 }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>;

    // ── Views ──
    function GenderSelect({ value, onChange }) {
      const [open, setOpen] = React.useState(false);
      const ref = React.useRef(null);
      const options = ['不透露', '女性', '男性', '非二元'];
      React.useEffect(() => {
        const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', close);
        return () => document.removeEventListener('mousedown', close);
      }, []);
      const base = { width:'100%', background:'rgba(27,18,0,0.55)', borderRadius:5, padding:'12px 16px',
        fontSize:14, fontFamily:"'Noto Serif TC', serif", outline:'none' };
      return (
        <div ref={ref} style={{ position:'relative' }}>
          <button type="button" onClick={() => setOpen(o => !o)} style={{ ...base,
            display:'flex', justifyContent:'space-between', alignItems:'center', cursor:'pointer',
            border: open ? '1px solid rgba(149,211,195,0.5)' : '1px solid rgba(149,211,195,0.2)',
            color: value ? 'var(--cream)' : 'rgba(200,184,138,0.35)' }}>
            <span>{value || '請選擇'}</span>
            <span style={{ fontSize:9, opacity:0.5 }}>{open ? '▲' : '▼'}</span>
          </button>
          {open && (
            <div style={{ position:'absolute', top:'calc(100% + 4px)', left:0, right:0, zIndex:300,
              background:'rgba(15,9,0,0.97)', backdropFilter:'blur(24px)',
              border:'1px solid rgba(149,211,195,0.2)', borderRadius:5,
              boxShadow:'0 12px 40px rgba(0,0,0,0.7)', overflow:'hidden' }}>
              {options.map((opt, i) => (
                <button key={opt} type="button" onClick={() => { onChange(opt); setOpen(false); }}
                  style={{ width:'100%', padding:'12px 16px', textAlign:'left', cursor:'pointer',
                    background: value === opt ? 'rgba(149,211,195,0.08)' : 'none', border:'none',
                    borderBottom: i < options.length-1 ? '1px solid rgba(149,211,195,0.07)' : 'none',
                    color: value === opt ? 'var(--jade)' : 'var(--cream)',
                    fontSize:14, fontFamily:"'Noto Serif TC', serif", letterSpacing:'0.05em' }}>
                  {opt}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

      const type = MBEI_TYPES[record.mbeiCode];

      const fortune = useMemo(() => {
        if (record.fortune) return record.fortune;
        if (record.foodType !== 'natural' && ['心悸','胃脹','想睡'].includes(record.bodyFeeling)) return FORTUNES[4];
        if (record.foodType === 'processed') return FORTUNES[0];
        if (record.mood === '被安撫') return FORTUNES[2];
        if (record.mood === '空虛') return FORTUNES[6];
        if (record.foodType === 'natural' && record.mood === '平靜' && record.bodyFeeling === '清爽') return FORTUNES[1];
        if (['獨處','聚餐'].includes(record.context)) return ['清爽','飽足'].includes(record.bodyFeeling) ? FORTUNES[5] : FORTUNES[3];
        if (['趕工','報告週','失眠後'].includes(record.context)) return FORTUNES[7];
        return FORTUNES[3];
      }, [record]);

        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 md:p-8 overflow-hidden">

      }, []);

        const normalized = normalizeEmail(profile.email);
        const profiles = loadProfiles();
        profiles[normalized] = profile;
        saveProfiles(profiles);
        localStorage.setItem(ACTIVE_USER_KEY, normalized);
        setLoginProfile(profile);

      const handleLogout = () => { localStorage.removeItem(ACTIVE_USER_KEY); setLoginProfile(null); };

        let mbei = '';

        return (mbei.length === 4 ? mbei : 'MPLR');

            id: Date.now().toString(),
            date: new Date().toISOString().split('T')[0],
            time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}),

            fortune: aiFortune || undefined,

          setLatestRecord(newRecord);

          setIsRecordOpen(false);

              className="scrollbar-hide md:pb-24">
              <div style={{ maxWidth:960, margin:'0 auto', padding:'32px 20px' }} className="md:p-12">
                {activeTab === 'home' && <HomeView records={records} />}
                {activeTab === 'almanac' && <AlmanacView records={records} />}
                {activeTab === 'insight' && <InsightView records={records} />}
                {activeTab === 'profile' && <ProfileView records={records} loginProfile={loginProfile} onLogout={handleLogout} />}
              </div>
            </main>

            {/* 手機底欄 */}
            <nav style={{ position:'fixed', bottom:0, left:0, right:0,
              background:'rgba(15,9,0,0.95)', borderRadius:'3px 3px 0 0', padding:'8px 12px 20px',
              display:'flex', alignItems:'center', justifyContent:'space-around',
              zIndex:40, borderTop:'1px solid rgba(149,211,195,0.15)',
              boxShadow:'0 -4px 24px rgba(0,0,0,0.4)' }}
              className="md:hidden">
              {['今日|home','曆卡|almanac', null, '洞察|insight','修身|profile'].map((item, i) => {
                if (!item) return (
                  <button key="record" onClick={() => setIsRecordOpen(true)}
                    style={{ width:52, height:40, background:'var(--crimson)', borderRadius:8,
                      border:'2px solid rgba(255,180,160,0.25)', display:'flex', alignItems:'center', justifyContent:'center',
                      color:'var(--blush)', fontSize:22, cursor:'pointer', flexShrink:0,
                      boxShadow:'0 4px 20px rgba(133,41,27,0.6)' }}>+</button>
                );
                const [label, tab] = item.split('|');
                return (
                  <button key={tab} onClick={() => setActiveTab(tab)}
                    style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:2, background:'none', border:'none', cursor:'pointer',
                      color: activeTab===tab ? 'var(--jade)' : 'var(--sand)', fontFamily:"'Noto Serif TC', serif", fontSize:13, fontWeight:600, flex:1 }}>
                    <span>{label}</span>
                  </button>
                );
              })}
            </nav>

            {isRecordOpen && <RecordModal onClose={() => setIsRecordOpen(false)} onSubmit={handleRecord} formData={formData} setFormData={setFormData} isLoading={isLoading} />}
            {showResult && latestRecord && <ResultModal record={latestRecord} onClose={() => setShowResult(false)} totalRecords={records.length} />}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
